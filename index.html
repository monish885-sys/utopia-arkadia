<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FREQUENCY · Ultimate Freshers Night · Utopia</title>
<meta name="description" content="FREQUENCY — the ultimate freshers night for SOAD & SOS. 23 September, 6 PM to 12 AM. School freshers interaction, then a complimentary DJ night by Utopia." />
<meta name="theme-color" content="#07081a" />
<meta property="og:title" content="FREQUENCY · Ultimate Freshers Night" />
<meta property="og:description" content="23 September · 6 PM – 12 AM. Freshers interaction for SOAD & SOS, followed by a complimentary DJ night by Utopia." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23c9f7ff'/%3E%3Cstop offset='.5' stop-color='%23a45cff'/%3E%3Cstop offset='1' stop-color='%23ff2ee6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='%2307081a'/%3E%3Cpath d='M32 9 52 55H43l-4-10H25l-4 10h-9zm0 15-5 13h10z' fill='url(%23g)'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Cinzel:wght@700;900&family=Pinyon+Script&display=swap" rel="stylesheet" />
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

<style>
:root {
  --bg: #07081a;
  --bg-1: #0c0e24;
  --bg-2: #13152f;
  --ink: #f4ecff;
  --ink-2: #b9b6d6;
  --muted: #7d7aa0;
  --line: rgba(160, 190, 255, 0.14);
  --line-2: rgba(160, 190, 255, 0.26);

  --cyan: #1fe4f2;
  --magenta: #ff2ee6;
  --violet: #8a4dff;
  --lav: #f7d8fb;
  --chip-ink: #10061a;

  --f-wordmark: 'Cinzel', 'Times New Roman', serif;
  --f-cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-wide: 'Archivo', 'Arial Black', sans-serif;
  --f-script: 'Pinyon Script', cursive;
  --f-body: 'Barlow', system-ui, sans-serif;

  --gutter: clamp(16px, 4.5vw, 44px);
  --maxw: 1200px;
  --r: 10px;
  --bracket: clamp(44px, 7vw, 92px);

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; overflow-x: clip; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100svh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img, svg, canvas { display: block; max-width: 100%; }
::selection { background: var(--magenta); color: #000; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.chrome {
  position: relative;
  display: inline-block;
  margin: 0;
  font-family: var(--f-wordmark);
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0.01em;
  color: transparent;
  background:
    linear-gradient(180deg,
      #effcff 0%, #9deeff 18%, #3a8fe0 38%, #1b3b8f 46%,
      #f3e6ff 50%, #d58cff 60%, #ff4fe3 76%, #ffd9fa 92%, #ffffff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  filter:
    drop-shadow(0 0 1px rgba(255, 255, 255, 0.9))
    drop-shadow(0 0 14px rgba(255, 46, 230, 0.45))
    drop-shadow(0 0 30px rgba(31, 228, 242, 0.28));
}
.chrome::before {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  z-index: -1;
  color: transparent;
  -webkit-text-stroke: 2px rgba(255, 190, 250, 0.85);
  transform: translate(1px, 2px);
}
.sparkle {
  position: absolute;
  width: 0.22em;
  height: 0.22em;
  pointer-events: none;
  background: radial-gradient(circle, #fff 0 12%, transparent 13%),
    conic-gradient(from 45deg, transparent 0 20%, #fff 24% 26%, transparent 30% 45%, #fff 49% 51%, transparent 55% 70%, #fff 74% 76%, transparent 80%);
  -webkit-mask: radial-gradient(circle, #000 0 30%, transparent 70%);
  mask: radial-gradient(circle, #000 0 30%, transparent 70%);
  filter: drop-shadow(0 0 4px #9ff3ff) drop-shadow(0 0 8px #fff);
  animation: glint 3.2s ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
@keyframes glint { 0%, 100% { opacity: 0.25; transform: scale(0.6) rotate(0deg); } 45% { opacity: 1; transform: scale(1.15) rotate(20deg); } }

.headline {
  margin: 0;
  font-family: var(--f-cond);
  font-weight: 800;
  text-transform: uppercase;
  line-height: 0.95;
  letter-spacing: 0.005em;
  color: var(--lav);
  text-shadow: -0.045em 0.03em 0 rgba(31, 228, 242, 0.75), 0.045em 0 0 rgba(255, 46, 230, 0.7), 0 0 26px rgba(255, 46, 230, 0.35);
}
.label {
  font-family: var(--f-cond);
  font-weight: 600;
  font-size: clamp(14px, 1.6vw, 19px);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--cyan);
  text-shadow: 0 0 14px rgba(31, 228, 242, 0.45);
}

.rule2 { display: flex; gap: 22px; justify-content: center; width: min(420px, 70%); margin: 18px auto 0; }
.rule2::before, .rule2::after { content: ''; flex: 1; height: 3px; border-radius: 2px; }
.rule2::before { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
.rule2::after { background: var(--magenta); box-shadow: 0 0 12px var(--magenta); }

.chips {
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  padding: 7px;
  border-radius: 12px;
  background: rgba(6, 6, 18, 0.72);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
.chip {
  display: inline-block;
  padding: 0.28em 0.7em 0.22em;
  border-radius: 6px;
  font-family: var(--f-cond);
  font-weight: 700;
  font-size: clamp(20px, 2.4vw, 30px);
  line-height: 1;
  text-transform: uppercase;
  color: var(--chip-ink);
  background: var(--magenta);
  box-shadow: 0 0 20px rgba(255, 46, 230, 0.55), inset 0 -3px 0 rgba(0, 0, 0, 0.18);
}
.chip--cyan { background: var(--cyan); box-shadow: 0 0 20px rgba(31, 228, 242, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
.chip--sm { font-size: 18px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 0 26px;
  border-radius: 8px;
  border: 0;
  font-family: var(--f-cond);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.btn--primary { color: var(--chip-ink); background: var(--magenta); box-shadow: 0 0 26px rgba(255, 46, 230, 0.55); }
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(255, 46, 230, 0.8); }
.btn--ghost { color: var(--cyan); background: rgba(31, 228, 242, 0.06); box-shadow: inset 0 0 0 1.5px var(--cyan); }
.btn--ghost:hover { background: rgba(31, 228, 242, 0.14); transform: translateY(-2px); }

.frame { position: relative; border: 1px solid var(--line-2); }
.frame::before {
  content: '';
  position: absolute;
  inset: clamp(8px, 1.4vw, 16px);
  border: 1px solid rgba(31, 228, 242, 0.16);
  border-radius: 6px;
  pointer-events: none;
}

.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.backdrop__glow {
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(38% 30% at 20% 14%, rgba(255, 46, 230, 0.13), transparent 70%),
    radial-gradient(36% 28% at 84% 24%, rgba(31, 228, 242, 0.11), transparent 70%),
    radial-gradient(60% 40% at 50% 108%, rgba(138, 77, 255, 0.2), transparent 70%);
}

.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: background 0.3s ease, border-color 0.3s ease; border-bottom: 1px solid transparent; }
.nav.is-scrolled { background: rgba(7, 8, 26, 0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom-color: var(--line); }
.nav__inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 66px; }
.nav__brand { text-decoration: none; font-size: 24px; }
.nav__links { display: none; gap: 30px; }
.nav__links a { text-decoration: none; font-family: var(--f-cond); font-weight: 600; font-size: 17px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-2); }
.nav .btn { min-height: 40px; padding: 0 16px; font-size: 18px; }
@media (min-width: 760px) { .nav__links { display: flex; } }

main { position: relative; z-index: 1; }
.hero { padding: 84px var(--gutter) 28px; }
.hero__frame {
  max-width: var(--maxw);
  min-height: calc(100svh - 112px);
  margin-inline: auto;
  padding: clamp(22px, 4vw, 48px);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(10, 12, 34, 0.55), rgba(7, 8, 26, 0.2));
}
.hero__wordmark { position: relative; z-index: 2; margin-top: clamp(36px, 5vw, 48px); font-size: clamp(48px, 11vw, 120px); }
.hero__sub { position: relative; z-index: 2; margin-top: 12px; }
.hero__when {
  position: relative;
  z-index: 2;
  margin-top: 14px;
  font-family: var(--f-cond);
  font-weight: 600;
  font-size: clamp(18px, 2.6vw, 28px);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
}
.hero__cta { position: relative; z-index: 2; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: clamp(16px, 2.5vw, 24px); }

.section { position: relative; z-index: 1; padding: clamp(40px, 8vw, 80px) 0; }
.section__head { text-align: center; margin-bottom: 30px; }

.reg { position: relative; }
.reg__frame {
  max-width: 560px;
  margin-inline: auto;
  padding: clamp(28px, 5vw, 48px) clamp(18px, 4vw, 36px);
  background: rgba(5, 5, 14, 0.72);
}
.reg__price { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 28px; }
.reg__amount {
  font-family: var(--f-cond);
  font-weight: 800;
  font-size: clamp(48px, 10vw, 72px);
  line-height: 1;
  color: var(--lav);
}
.reg__fields { display: grid; gap: 18px; text-align: left; }
.field label { display: block; font-family: var(--f-cond); font-weight: 600; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cyan); margin-bottom: 8px; }
.field input {
  width: 100%; min-height: 52px; padding: 0 16px; border-radius: 8px; border: 1.5px solid var(--line-2); background: rgba(7, 8, 26, 0.9); color: var(--ink); font-family: var(--f-cond); font-weight: 600; font-size: 20px; outline: none;
}
.reg__actions { display: grid; gap: 12px; margin-top: 26px; }
.reg__actions .btn { width: 100%; justify-content: center; }
</style>
</head>

<body>
<div class="backdrop" aria-hidden="true">
  <div class="backdrop__glow"></div>
</div>

<header class="nav" id="nav">
  <div class="wrap nav__inner">
    <a href="#top" class="nav__brand chrome" data-text="FREQUENCY">FREQUENCY</a>
    <nav class="nav__links">
      <a href="#pass">Pass</a>
    </nav>
    <a href="#pass" class="btn btn--primary">Pass · ₹549</a>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="hero__frame frame">
      <h1 class="hero__wordmark chrome" data-text="FREQUENCY">FREQUENCY</h1>
      <div class="hero__sub label">Ultimate Freshers Night</div>
      <div class="hero__when">23 September · 6 PM – 12 AM</div>

      <div class="hero__cta">
        <a href="#pass" class="btn btn--primary">Pass · ₹549</a>
      </div>
    </div>
  </section>

  <section class="section" id="pass">
    <div class="wrap">
      <div class="reg">
        <div class="reg__frame frame">
          <div class="reg__price">
            <div class="label">Pass Price</div>
            <div class="reg__amount"><small>₹</small>549</div>
          </div>
          <form id="payForm" class="reg__fields" onsubmit="return false;">
            <div class="field">
              <label for="studentName">Full Name</label>
              <input type="text" id="studentName" placeholder="John Doe" required />
            </div>
            <div class="field">
              <label for="studentEmail">Email</label>
              <input type="email" id="studentEmail" placeholder="john@example.com" required />
            </div>
            <div class="field">
              <label for="studentPhone">Phone Number</label>
              <input type="tel" id="studentPhone" placeholder="9876543210" required />
            </div>
            <div class="reg__actions">
              <button type="button" id="payBtn" class="btn btn--primary">Pay ₹549 & Get Pass</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const PAYMENT = {
  keyId: 'rzp_live_TdtFDqlq20A6kt',
  amountInr: 549,
  name: 'Utopia',
  description: 'FREQUENCY — Freshers Night Pass'
};

document.getElementById('payBtn').addEventListener('click', function (e) {
  e.preventDefault();

  const name = document.getElementById('studentName').value.trim();
  const email = document.getElementById('studentEmail').value.trim();
  const phone = document.getElementById('studentPhone').value.trim();

  if (!name || !email || !phone) {
    alert('Please fill out all details.');
    return;
  }

  if (typeof Razorpay === 'undefined') {
    alert('Razorpay SDK failed to load. Check your internet connection or ad-blocker.');
    return;
  }

  const options = {
    key: PAYMENT.keyId,
    amount: PAYMENT.amountInr * 100,
    currency: 'INR',
    name: PAYMENT.name,
    description: PAYMENT.description,
    handler: function (response) {
      document.getElementById('payBtn').textContent = 'Pass Secured ✓';
      document.getElementById('payBtn').disabled = true;
      alert('Payment successful! Payment ID: ' + response.razorpay_payment_id);
    },
    prefill: { name: name, email: email, contact: phone },
    theme: { color: '#ff2ee6' }
  };

  const rzp = new Razorpay(options);
  rzp.open();
});
</script>
</body>
</html>
